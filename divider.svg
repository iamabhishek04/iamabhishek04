<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="16" viewBox="0 0 1000 16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B026FF"/>
      <stop offset="1" stop-color="#FF00E6" stop-opacity="0"/>
    </linearGradient>
    <filter id="f" filterUnits="userSpaceOnUse" x="-20" y="-10" width="1040" height="36">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="7" width="1000" height="2" fill="url(#g)" filter="url(#f)"/>
  <circle cy="8" r="4" fill="#39FF14" filter="url(#f)">
    <animate attributeName="cx" values="0;1000;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cy="8" r="2.5" fill="#00F5FF" filter="url(#f)">
    <animate attributeName="cx" values="1000;0;1000" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
