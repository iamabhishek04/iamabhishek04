<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0221"/>
      <stop offset="1" stop-color="#1a0b3d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#B026FF;#FF00E6;#39FF14;#00F5FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#B026FF">
        <animate attributeName="stop-color" values="#B026FF;#FF00E6;#39FF14;#00F5FF;#B026FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#FF00E6">
        <animate attributeName="stop-color" values="#FF00E6;#39FF14;#00F5FF;#B026FF;#FF00E6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F5FF" stroke-opacity="0.10"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="260" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect x="-40" y="-40" width="1080" height="340" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- scanning line -->
    <rect width="1000" height="3" fill="#00F5FF" opacity="0.35" filter="url(#soft)">
      <animate attributeName="y" values="-10;270" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- floating particles -->
    <g filter="url(#soft)">
      <circle cx="80"  cy="220" r="3" fill="#00F5FF"><animate attributeName="cy" values="260;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="240" r="2" fill="#FF00E6"><animate attributeName="cy" values="260;-10" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="250" r="3" fill="#39FF14"><animate attributeName="cy" values="260;-10" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="245" r="2" fill="#B026FF"><animate attributeName="cy" values="260;-10" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="250" r="3" fill="#00F5FF"><animate attributeName="cy" values="260;-10" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="235" r="2" fill="#FF00E6"><animate attributeName="cy" values="260;-10" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- animated neon border -->
  <rect x="3" y="3" width="994" height="254" rx="14" fill="none" stroke="url(#neon)" stroke-width="3" stroke-dasharray="40 14" filter="url(#soft)">
    <animate attributeName="stroke-dashoffset" from="0" to="-108" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <text x="500" y="125" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="70" font-weight="bold" letter-spacing="10" fill="url(#neon)" filter="url(#glow)">
    ABHISHEK A
    <animate attributeName="opacity" values="1;1;1;0.82;1;0.93;1;1" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- subtitle -->
  <text x="500" y="172" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="20" letter-spacing="5" fill="#00F5FF" filter="url(#soft)">
    AI &amp; DATA SCIENCE  •  COMPUTER VISION  •  IoT
    <animate attributeName="opacity" values="0.65;1;0.65" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- underline -->
  <rect x="380" y="195" width="240" height="3" rx="2" fill="url(#neon)" filter="url(#soft)">
    <animate attributeName="width" values="40;240;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="480;380;480" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
